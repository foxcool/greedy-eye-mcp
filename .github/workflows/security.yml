name: Security

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # The sibling greedy-eye checkout predates the published backend tag; go.mod no
  # longer has a replace, so the module comes from the proxy and the checkout is unused.
  govulncheck:
    name: Scan dependencies for vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: greedy-eye-mcp
      - uses: actions/checkout@v4
        with:
          repository: foxcool/greedy-eye
          ref: main
          path: greedy-eye

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run govulncheck
        working-directory: greedy-eye-mcp
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    name: Static security analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The action ships gosec and its Go together. Building gosec@latest against
      # setup-go's stable toolchain broke when Go outran gosec's x/tools ("export
      # data version 5 is greater than maximum supported version 4").
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -exclude-generated ./...

  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
